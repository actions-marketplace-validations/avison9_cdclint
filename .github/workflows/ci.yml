name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    # Pinned rather than ubuntu-latest: the label moves to Ubuntu 26 on
    # 2026-10-19 and a CI image should change when this file does, not
    # when GitHub's calendar does.
    runs-on: ubuntu-24.04
    steps:
      # checkout v5 and setup-go v6 are the first majors that run on Node 24; v4 and v5 ran on
      # Node 20, which the runners deprecated in September 2025.
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Standard library only, so there is no go.sum to key a module
          # cache on; with cache on, setup-go warns that it cannot find one.
          cache: false
      # A block scalar, because a plain one containing ": " is read by YAML
      # as a mapping and the whole workflow fails to parse in 0 seconds.
      - run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
